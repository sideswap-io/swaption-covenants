[package]
name = "lending-contracts"
version = "0.1.0"
edition = "2024"
description = "Simplicity Lending contract"
license = "MIT OR Apache-2.0"
repository = "https://github.com/BlockstreamResearch/simplicity-lending"
readme = "README.md"
keywords = ["simplicity", "lending", "liquid", "bitcoin", "elements", "contracts"]
categories = ["cryptography::cryptocurrencies"]

[features]
default = ["asset_auth", "script_auth", "lending", "pre_lock"]
asset_auth = []
script_auth = []
lending = []
pre_lock = []

# Vendored 2026-09-02 from BlockstreamResearch/simplicity-lending
# crates/contracts (MIT OR Apache-2.0) as the starting point of the
# Swaption lending product — see docs/LENDING-DESIGN.md. Artifacts under
# src/artifacts are GENERATED by `simplex build` (Simplex 0.0.5, binary at
# ~/toolchain/simplex on the build host) and are not committed.

[dependencies]
ring = "0.17.14"
hex.workspace = true
thiserror.workspace = true

smplx-std = "0.0.5"

[dev-dependencies]
anyhow = "1"
